# BACKEND — Single buildspec.yml for ALL 4 environments
#
# This file is used by ALL backend CodeBuild projects:
#   backend-dev-build     → APP_ENV=dev
#   backend-qa-build      → APP_ENV=qa
#   backend-preprod-build → APP_ENV=preprod
#   backend-prod-build    → APP_ENV=prod
#
# In each CodeBuild project, set ONE environment variable:
#   Name  : APP_ENV
#   Value : dev   (or qa / preprod / prod)
#
# IMPORTANT — Backend env loading works differently from React:
#   - The .env.dev / .env.qa / .env.preprod / .env.prod files
#     are committed to the repo and shipped to EC2 by CodeDeploy.
#   - The correct file is loaded at RUNTIME (not build time).
#   - ecosystem.config.js on each EC2 sets NODE_ENV.
#   - index.js reads NODE_ENV and loads .env.{NODE_ENV}.
#   - CodeBuild only runs npm install — no build step needed.
